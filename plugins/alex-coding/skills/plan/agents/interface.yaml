interface:
  display_name: "Plan"
  short_description: "Project-context-driven plan workflow"
  default_prompt: "Use alex-coding:plan for this repository task."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "generic"]
  activation:
    mode: "automatic"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
